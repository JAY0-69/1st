<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift to my Love</title>
    <link rel="stylesheet" href="gift.css">
</head>
<body>
    <h1 id="greeting"></h1>

    <button id="prevBtn">⇐</button>

    <div id="buttons">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No 😔</button>
    </div>


    <div id="journeyMap">

    <div class="stop">
        <button class="memoryPoint">❤️</button>
        <p>Where it started</p>
    </div>

    <div class="stop">
        <button class="memoryPoint">1</button>
        <p>Remember this...?</p>
    </div>

    <div class="stop">
        <button class="memoryPoint">2</button>
        <p>A special moment</p>
    </div>

    <div class="stop">
        <button class="memoryPoint">3</button>
        <p>One of my favourite photos.</p>
    </div>

    <div class="stop">
        <button class="memoryPoint">❤️</button>
        <p>Where we are now</p>
    </div>

</div>

<div id="memoryPopup">
    <div id="memoryCard">
        <button id="closePopup">×</button>

        <img id="memoryPhoto" src="" alt="Our memory">

        <h2 id="memoryTitle"></h2>
        <p id="memoryText"></p>
    </div>
</div>

<script src="gift.js"></script>
</body>
</html>
